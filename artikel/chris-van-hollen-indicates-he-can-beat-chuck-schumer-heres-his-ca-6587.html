<h3 style='margin-top:16px; margin-bottom:8px;'>Chris Van Hollen says he will challenge Chuck Schumer for Senate majority leader</h3>
<p>Sen. Chris Van Hollen of Maryland said Monday that he is gaining momentum in his bid to unseat longtime Democratic leader Chuck Schumer, taking a traditionally private Senate leadership contest into public view.</p>
<p>"Well, I'm the underdog, but we are really moving in the right direction here," Van Hollen told NPR's Steve Inskeep on Morning Edition.</p>
<p>Over the weekend, he appeared on CNN, ABC and Fox News to make his case for new Democratic leadership after his party's sweeping midterm victories. Schumer, who has led Senate Democrats for nearly a decade, says he has enough votes to remain leader.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>How Sen. Chris Van Hollen plans to flex Democratic power on the foreign aid front</h3>
<p>Van Hollen is hardly a Washington outsider. The progressive Democrat has spent nearly 25 years on Capitol Hill, served as a deputy to then-House Speaker Nancy Pelosi and led Democratic campaign efforts in both chambers. He has been a vocal opponent of the Trump administration's immigration crackdown and dismantling of the U.S. Agency for International Development, and he has called for investigations into the administration's foreign aid cuts.</p>
<p>Schumer has continued to support U.S. military assistance to Israel despite his criticism of Prime Minister Benjamin Netanyahu. Van Hollen, by contrast, has pushed to restrict weapons sales and military aid to the Israeli government over its war in Gaza, while pressing for more humanitarian aid to Palestinians.</p>
<p>"I certainly oppose the idea of an American taxpayer blank check to the government of Israel, regardless of its actions," Van Hollen said.</p>
<p>Van Hollen also wants Democratic leaders to stay out of contested primaries. He pointed to the victories of incoming Sens. Abdul El-Sayed of Michigan and Peggy Flanagan of Minnesota.</p>
<p>"We have two senators-elect who would not be there if the current majority leader had his way," he said.</p>
<p>He described the midterm victories as a populist rejection of President Trump, rather than an election orchestrated by Washington Democrats.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>What's Trump's strategy now with Iran? To keep things as they are</h3>
<p>Van Hollen also cited legislation to strengthen labor unions, which never received a vote on the Senate floor. On the war in Iran, he called for an end to further funding.</p>
<p>"We should not be voting for one penny in mid-December to continue this war," he said.</p>
<p>Van Hollen will need close to 30 votes, a simple majority of the Senate Democratic caucus, to win. The election will be decided by secret ballot behind closed doors, making it difficult to know how many votes either candidate secured.</p>
