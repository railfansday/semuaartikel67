        <h1>The U.N.'s top court rules Myanmar committed genocide against the Rohingya</h1>
        <div class="meta-line">🌐 Source: <strong>Npr</strong> &bull; 📅 19 Nov 2026 &bull; ⏱️ 7 min read (1387 words, 📚 Deep Dive)</div>

                <li>Embed

<p>Rohingya refugees watch the International Court of Justice ruling over whether Myanmar committed genocide against Rohingya Muslims, on a screen at a camp in Bangladesh's Cox's Bazar on Nov. 19.
                
                    
                    Salahuddin Ahmed/AFP via Getty Images
                    
                
hide caption</p>
<p>The United Nations' top court ruled Thursday that Myanmar committed genocide against its Rohingya minority, the first time in the court's 80-year history that it has held a state responsible for the crime.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>International Court of Justice issues ruling on Myanmar genocide case</h3>
<p>Judges of the International Court of Justice voted 9-6 that the military's 2017 crackdown was carried out with intent to destroy the long-persecuted Muslim minority. Myanmar's military-backed government has not yet responded to the ruling at the time of writing.</p>
<p>Brought by Gambia under the 1948 Genocide Convention, the ruling will have repercussions far beyond Myanmar, according to a legal expert.</p>
<p>But for Ma Roga Bibi, a Rohingya who fled Maungdaw township in northern Rakhine state, the impact was immediate.</p>
<p>"I feel wonderful and grateful," said the 18-year-old, who lives in the world's largest refugee settlement in Bangladesh. "It was an emotional, historic day."</p>
<p>For several weeks in August and September 2017, the Myanmar military attacked and burned to the ground hundreds of Rohingya villages. Soldiers committed rapes and massacred women, men as well as children.</p>
<p>The court estimated that about 10,000 Rohingya were killed. It cited estimates that up to 2,109 Rohingya children younger than 5 died, and found the violence was systematic, including the burning of all or parts of 392 villages.</p>
<p>Judges of the International Court of Justice (ICJ) attend a public hearing ahead of the reading of the court's judgment in the genocide case brought by Gambia against Myanmar, in The Hague on Thursday.
                
                    
                    Jeroen Jumelet/ANP/AFP via Getty Images
                    
                
hide caption</p>
<p>Ma Roga Bibi, then age 9, was one of about 700,000 people to flee to Bangladesh, joining earlier refugee waves. The camps sprawl across a narrow coastal strip a few miles from Cox's Bazar, a busy beach town near Myanmar. Rohingya are denied citizenship on both sides of the border.</p>
<p>"Recognition alone is not enough," she said. "We need justice, accountability, and the opportunity to return home with dignity."</p>
<p>She wants to be a doctor, adding, "in our Rohingya community, there is no girl doctor."</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>9 years on, Rohingya crisis enters dangerous phase</h3>
<p>Khin Khin Myint, 18, a refugee leader in activist group Rohingya Youth Voice from Buthidaung Township, also in Camp 16, said Rohingya women and girls have experienced "unimaginable suffering."</p>
<p>"We want the world to listen to survivors, recognize their courage, and include women in decisions about our future," she said. "We expect the international community to move beyond a statement of sympathy."</p>
<p>Myanmar had argued its military was conducting counterinsurgency operations against an armed group, the Arakan Rohingya Salvation Army. The court said the military failed to distinguish between civilians and alleged insurgents, and that the scale and nature of the violence could not be explained by counterterrorism.</p>
<p>"The execution of Rohingya men and boys in some locations, the widespread sexual violence, the targeting of children and babies, the methodical burning of villages, and attacks on fleeing civilians are not consistent with an intent to conduct counterinsurgency operations," said ICJ president, Judge Yuji Iwasawa.</p>
<p>Rohingya refugees watch the International Court of Justice ruling over whether Myanmar committed genocide against Rohingya Muslims, on a screen at a camp in Bangladesh's Cox's Bazar, on Thursday.
                
                    
                    Salahuddin Ahmed/AFP via Getty Images
                    
                
hide caption</p>
<p>Antonia Mulvey, executive director of Legal Action Worldwide, a human rights group based in Geneva, said the court found evidence from the U.N. and rights organizations credible, and that counterterrorism operations were not a defense to Myanmar's argument.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>3 things to know about the genocide case against Israel in The Hague</h3>
<p>She said the ruling will affect future genocide cases, including South Africa's case against Israel, on questions such as genocidal intent and state responsibility.</p>
<p>"Although every case must ultimately be decided on its own evidence," she said.</p>
<p>The judgment is binding on Myanmar and on all states that have ratified the Genocide Convention, she explained. All countries should review trade agreements, including arms and jet fuel supplies, and financial and economic ties with the junta, she said, while supporting accountability and reparations for the Rohingya. But the court, which hears disputes between states, can't enforce its decisions.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>A group long denied recognition</h3>
<p>In Myanmar, Rohingya are widely regarded as interlopers from Bangladesh, despite generations of roots in Myanmar.</p>
<p>Iwasawa, however, identified the Rohingya as a distinct ethnic group, saying their language and art set them apart, and that they self-identify as such. He said they have been discriminated against by Myanmar "for decades" and qualify as a protected group.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>U.S. officially says Myanmar's violence against Rohingya was genocide</h3>
<p>The United States had previously reached a similar conclusion. In 2022, the Biden administration formally determined that Myanmar's military had committed genocide and crimes against humanity against the Rohingya during its 2016 and 2017 operations.</p>
<p>But tensions have mounted between the Trump administration and international justice bodies. In a statement to NPR on Thursday, the State Department expressed support for Rohingya refugees but raised doubts about the International Court of Justice. "The proper interpretation of the Genocide Convention is of paramount importance, as is preventing politicization of the ICJ. We are studying the decision to fully assess its implications," the State Department said.</p>
<p>In October, U.S. Ambassador to the U.N. Mike Waltz wrote online, "The ICJ must not be allowed to lower the legal threshold for proving genocide" so it can later be weaponized against U.S. and allied soldiers.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>With makeshift jump ropes and hide and seek, kids play to cope with crisis</h3>
<p>Yet international human rights organizations and the United Nations applauded the court's judgment.</p>
<p>U.N. Secretary-General António Guterres called it "a powerful recognition of the Rohingya victims of genocide" and said it reaffirms that "impunity for such horrific acts must not stand."</p>
<p>The judgment does not order Myanmar to grant citizenship, saying such the issue fell outside the scope of the measures being considered to prevent future atrocities.</p>
<p>However, Myanmar must take steps to investigate people suspected of involvement in the crimes and prosecute them if warranted, said the court. It also found Myanmar must provide restitution and compensation, with the amount to be set in future proceedings.</p>
<p>The order to enable displaced Rohingya to return runs into a hard reality: The territory is now controlled by ethnic Rakhine armed group the Arakan Army.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>After nearly 6 years, ex-Myanmar leader Aung San Suu Kyi's son hears her voice</h3>
<p>Rakhine state has been ravaged by conflict between the military and the group, which now controls most of it.</p>
<p>Su Mon, a senior analyst at the independent conflict monitor Armed Conflict Location & Event Data, said the Rohingya in Myanmar and in the camps are "threatened by multiple armed groups," including Rohingya armed groups, the Arakan Army and the military.</p>
<p>Nearly all are stateless, she said, with few viable ways to earn a living or get food. Many are "on the verge of acute famine" because of aid shortfalls in the camps and a junta blockade in Rakhine.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>Photos: This is life in the world's largest refugee camp, as seen by their own</h3>
<p>"Unless the broader conflict dynamics in Rakhine state improve or credible guarantees of safety are secured from all armed actors, the prospects for displaced Rohingya to return to their homes remain bleak," she added.</p>
<p>She urged the military to halt airstrikes, drone attacks and the use of advanced weaponry in northern Rakhine, lift its blockade and give humanitarian groups full access, including in Arakan Army-controlled areas.</p>
<p>Lorcán Lovett reported from Thailand. Michele Kelemen contributed reporting from Washington, D.C.</p>
