        <h1>For workplace culture champions, Jensen Huang's return is 'unfathomable'</h1>
        <div class="meta-line">🌐 Source: <strong>Npr</strong> &bull; 📅 24 Nov 2026 &bull; ⏱️ 6 min read (1119 words, 📚 Deep Dive)</div>

                <li>Embed

<p>Nvidia CEO Jensen Huang speaks to media after a roundtable with South Korean AI and robotics startups on June 8, 2026, in Seoul, South Korea.
                
                    
                    Chung Sung-Jun/Getty Images AsiaPac
                    
                
hide caption</p>
<p>On Monday morning, a couple hours after Nvidia's board announced it had reinstated co-founder Jensen Huang as CEO, President Trump shared an AI-generated image on social media.</p>
<p>It's based on that striking photo of the president from 2024, just after he survived an assasination attempt. Surrounded by Secret Service agents, his face bloodied, Trump hoists a defiant fist in the air.</p>
<p>In the doctored photo, instead of Trump, it's Huang. An Nvidia flag flies behind him. And in his hoisted fist, he holds a red bra.</p>
<p>"I was absolutely flabbergasted," says Bo Young Lee, who worked as chief diversity officer at Uber for five years starting in 2018.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>Trump claims credit as Jensen Huang returns to Nvidia</h3>
<p>To Lee, it seems Trump is suggesting that the Nvidia CEO is as important to the country as he is.</p>
<p>"But then also the red bra is an indication that it's open hunting season for women," she says. "It stirs up all sorts of stereotypes and misogynistic perspectives about women."</p>
<p>To others, the image drives home the idea that in Silicon Valley, as long as you're successful, anything goes.</p>
<p>The White House has not responded to NPR's questions about what Trump was trying to say with the image.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>Spy intrigue overshadows workplace transgressions</h3>
<p>Even as Huang's return to Nvidia has been cheered by investors, some employees and Trump, it has sparked shock and disbelief among others, including those who have long worked to improve workplace culture in Silicon Valley.</p>
<p>"It's actually unfathomable to me," says Lee, who now serves as an adviser to AI4ALL, a nonprofit dedicated to increasing diversity, inclusion, and responsible practices in artificial intelligence.</p>
<p>After The New York Times revealed that Huang had engaged in an extramarital affair with a woman the U.S government believes is a Chinese intelligence asset, Lee watched as the broader conversation was dominated by concerns about national security, corporate governance and Nvidia's stock price.</p>
<p>That scandal overshadowed allegations of other problematic behavior in the workplace, specifically Huang's alleged affair with Kimberly Powell, Nvidia's vice president of healthcare, one of Huang's many direct reports.</p>
<p>"Everyone is minimizing that alleged relationship there because of who she is," says Lee.</p>
<p>The fact that Powell is herself a senior leader who makes a lot of money shouldn't matter, Lee says. She argues that people in subordinate roles, even powerful ones, can't properly consent, "simply for the fact that there is this power differential."</p>
<p>Nvidia's board did find that Huang's behavior was "inconsistent" with the company's code of conduct. By Monday morning, that didn't seem to matter.</p>
<p>"The Board of Directors voted unanimously to reinstate Mr. Huang following a series of discussions and meetings with Mr. Huang, after which the Board was satisfied with respect to Mr. Huang's candor and ability to lead Nvidia," the board said in a statement.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>Anthropic says it will put humanity first. Will its IPO change that?</h3>
<p>Lee says that response sends a message to Nvidia employees and all of Silicon Valley that it's OK to break the rules as long as you come clean.</p>
<p>"'Just be transparent with us,'" she imagines the board saying.</p>
<p>Nvidia did not respond to NPR's questions about Lee's concerns.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>A deepening of "tech bro" culture in Trump's second term</h3>
<p>In Silicon Valley, there have been private conversations about Huang's alleged workplace transgressions and the power dynamics at play, but women don't appear eager to speak publicly.</p>
<p>NPR reached out to two dozen women who work in the tech space. Freada Kapor Klein was one of the few willing to talk. The social impact investor says conversations about workplace behavior are much quieter than they have been in other eras, such as in 2017 and 2018, when a number of venture capitalists resigned amid allegations they were sexually harassing female entrepreneurs.</p>
<p>In 2017, Kapor Klein and her husband, Mitch Kapor, used their positions as early investors in Uber to publicly call out the company over its toxic culture, one they said tolerated bullying and harassment. The co-founder and CEO Travis Kalanick ended up resigning. Kapor Klein hoped it'd be a teachable moment.</p>
<p>But now, she feels Silicon Valley has gone backwards.</p>
<p>"Tech bro culture is stronger now than I have seen it in decades," she says, adding that Trump's attacks on DEI have amplified that culture.</p>
<p>Among women and people of color in Silicon Valley, she says there's now real trepidation about the anti-DEI sentiment — the axing of programs, chief diversity officers and employee resource groups.</p>
<p>"All of the supports or mechanisms have been pretty much stripped away," she says.</p>
<p>Screens display news of the reinstatement of Jensen Huang, seen outside the NASDAQ MarketSite, in New York, on November 23, 2026.
                
                    
                    Angela Weiss/AFP via Getty Images
                    
                
hide caption</p>
<p>To be clear, Huang has not been accused of predatory behavior. Still, Kapor Klein says his swift comeback is troubling.</p>
<p>"It is a resounding message that all that matters is money," she says. "If you are thought of as a singular talent, you can violate corporate policy, you can possibly threaten national security, you can make up your own rules as you go, you can create toxic workplace culture — as long as you bring in the money."</p>
<p>By the end of last week, Nvidia's stock had fallen almost 49% from its peak in October, and about 27% from before Huang's resignation. On Monday, it rebounded significantly.</p>
<p>Lee says Silicon Valley has always had an unhealthy relationship with its "genius founders."</p>
<p>"We elevate these leaders to god-like levels, and that's been done to Mark Zuckerberg, and that's being done to Sam Altman, and that's definitely [been] done to Jensen Huang," says Lee. "You become untouchable at that point."</p>
<p>Kapor Klein says what's unfolded at Nvidia has made abundantly clear that AI companies need guardrails for their CEOs, not just for the tools they're creating.</p>
<p>"We see a board that ignored that," she says. "There are no guardrails on this CEO's behavior."</p>
<p>NPR's Scott Horsley contributed to this story.</p>
