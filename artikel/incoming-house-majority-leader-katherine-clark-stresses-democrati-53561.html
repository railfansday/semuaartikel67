<h3 style='margin-top:16px; margin-bottom:8px;'>Democrats formally nominate Hakeem Jeffries for speaker of the House</h3>
<p>House Democrats needed a bigger room Wednesday to accommodate their newly expanded caucus, according to Rep. Katherine Clark of Massachusetts.</p>
<p>Nominated to become the first woman to serve as House majority leader next year, Clark reflected on the moment in an interview with Morning Edition on Thursday.</p>
<p>"It was really looking at the diversity of that caucus, people who have been sent to Congress from all walks of life, that gives me the optimism and the energy that we can really deliver for the American people," she said.</p>
<p>Clark, who is currently the House minority whip, was nominated for House majority leader by a unanimous voice vote. Democrats also nominated Hakeem Jeffries for speaker and Pete Aguilar for majority whip.</p>
<p>The incoming leadership faces the challenge of lowering living costs while investigating alleged corruption in the Trump administration.</p>
<p>"Of course we can," she said when asked whether Democrats could accomplish both. "That's our responsibility."</p>
<p>She also called President Trump's description of himself as "Mr. Veto" a "stunning statement," expressing hope for bipartisan cooperation on healthcare.</p>
<p>But Democrats face divisions within their own ranks.</p>
<p>Jeffries won his nomination 251-11. Opposition came from incoming progressives including Darializa Avila Chevalier of New York and Adam Hamawy of New Jersey. They have pressed for Medicare for All, immigration enforcement reforms and an end to the war in Gaza.</p>
<p>The two leaders have differed over U.S. aid to Israel. In July, Clark voted for a Republican amendment that would have cut military aid to Israel, while Jeffries opposed it.</p>
<p>Despite that disagreement and concerns among other Democrats about Jeffries' leadership, she emphasized party unity when asked whether the 11 votes against him could complicate Democrats' agenda.</p>
<p>"We are having conversations with every part of our new caucus, and they are united behind making life better for working people," she said.</p>
