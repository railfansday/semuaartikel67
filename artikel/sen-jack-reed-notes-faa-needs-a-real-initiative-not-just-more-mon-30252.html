<h3 style='margin-top:16px; margin-bottom:8px;'>FAA blames Friday's ground stop on 'equipment issue' during telecoms network upgrade</h3>
<p>After last week's nationwide ground stop, Sen. Jack Reed, D-R.I., raised concerns Tuesday about the Federal Aviation Administration's oversight of contractors.</p>
<p>"Was the contractor properly supervised? I have questions too about whether FAA, after DOGE, is capable of supervising these types of activities," Reed told NPR's Michel Martin on Morning Edition.</p>
<p>Reed said the administration's explanation of an apparent contractor error made sense, but called for a closer examination of its cause.</p>
<p>Friday's four-hour ground stop occurred as a federal contractor was replacing copper wiring with fiber optic cables at an FAA facility in Arkansas. The exact cause remains under investigation, and federal officials say there is no indication of a cyberattack.</p>
<p>The disruption has renewed debate in Congress over funding for the aging system.</p>
<p>Transportation Secretary Sean Duffy initially requested $30 billion in additional funding before increasing the figure to $50 billion. Congress has already provided $14.5 billion for FAA modernization. Roughly $9 billion is still unspent.</p>
<h3 style='margin-top:16px; margin-bottom:8px;'>Trump administration requests $50B in funding after nationwide flight disruptions</h3>
<p>Reed, who sits on the Senate Appropriations Committee, criticized the administration for seeking more money without presenting a detailed plan.</p>
<p>"They're just trying to throw money at a problem," he said.</p>
<p>Reed also agreed with Texas Republican Sen. Ted Cruz, who has questioned whether some of the proposed funding would go toward airport improvements rather than safety.</p>
<p>"The top priority in my book is getting this system back up to speed," Reed said.</p>
