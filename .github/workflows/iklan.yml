name: Sisipkan Banner Google Referrer ke HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  inject-google-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan skrip penyisipan banner ke HTML
        run: |
          python - << 'EOF'
          import os

          TARGET_FOLDER = "."

          BANNER_CODE = """
          <!-- Banner Otomatis Saat Klik dari Google + Tombol Close -->
          <style>
            #googleAdsBox {
              display: none;
              position: fixed;
              bottom: 16px;
              right: 16px;
              z-index: 99999;
              background: #ffffff;
              border: 1px solid #cbd5e1;
              border-radius: 10px;
              box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
              padding: 28px 8px 8px 8px;
              width: 316px;
              box-sizing: border-box;
            }
            #googleAdsBar {
              position: absolute;
              top: 0;
              left: 0;
              right: 0;
              height: 26px;
              background: #0f172a;
              color: #ffffff;
              border-top-left-radius: 9px;
              border-top-right-radius: 9px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 10px;
              font-size: 11px;
              font-family: Arial, sans-serif;
            }
            #googleAdsClose {
              background: #ef4444;
              color: #ffffff;
              border: none;
              border-radius: 4px;
              width: 22px;
              height: 20px;
              font-size: 15px;
              line-height: 18px;
              font-weight: bold;
              cursor: pointer;
              padding: 0;
            }
            #googleAdsClose:hover {
              background: #dc2626;
            }
            #googleAdsSlot {
              width: 300px;
              height: 250px;
              margin: 0 auto;
              overflow: hidden;
            }
            @media (max-width: 480px) {
              #googleAdsBox {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                bottom: 12px;
              }
            }
          </style>

          <div id="googleAdsBox">
            <div id="googleAdsBar">
              <span>Advertisement</span>
              <button id="googleAdsClose" type="button" title="Close" onclick="tutupGoogleAds()">&times;</button>
            </div>
            <div id="googleAdsSlot"></div>
          </div>

          <script>
          (function() {
            function datangDariGoogle() {
              var ref = (document.referrer || "").toLowerCase();
              var query = new URLSearchParams(window.location.search);
              return ref.indexOf("google.") !== -1 || query.get("from_google") === "1";
            }

            function muatIklan(target) {
              atOptions = {
                'key' : '52fc2d82f5b0964edc0ba2f6a4053f9a',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
              var scriptIklan = document.createElement("script");
              scriptIklan.type = "text/javascript";
              scriptIklan.src = "https://bicea.org/22/52fc2d82f5b0964edc0ba2f6a4053f9a";
              target.innerHTML = "";
              target.appendChild(scriptIklan);
            }

            window.tutupGoogleAds = function() {
              var box = document.getElementById("googleAdsBox");
              var slot = document.getElementById("googleAdsSlot");
              if (box) box.style.display = "none";
              if (slot) slot.innerHTML = "";
            };

            window.addEventListener("DOMContentLoaded", function() {
              if (datangDariGoogle()) {
                var box = document.getElementById("googleAdsBox");
                var slot = document.getElementById("googleAdsSlot");
                if (box && slot) {
                  box.style.display = "block";
                  muatIklan(slot);
                }
              }
            });
          })();
          </script>
          """

          berhasil = 0
          dilewati = 0

          for root, dirs, files in os.walk(TARGET_FOLDER):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for filename in files:
                  if not filename.endswith(".html"):
                      continue
                  if filename.startswith("google") and filename.endswith(".html"):
                      dilewati += 1
                      continue

                  filepath = os.path.join(root, filename)
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      konten = f.read()

                  if "googleAdsBox" in konten:
                      dilewati += 1
                      continue

                  if "</body>" in konten:
                      konten_baru = konten.replace("</body>", BANNER_CODE + "\n</body>", 1)
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(konten_baru)
                      berhasil += 1
                  elif "</html>" in konten:
                      konten_baru = konten.replace("</html>", BANNER_CODE + "\n</html>", 1)
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(konten_baru)
                      berhasil += 1
                  else:
                      dilewati += 1

          print(f"Selesai! Berhasil disisipkan ke {berhasil} file HTML, dilewati {dilewati} file.")
          EOF

      - name: Commit dan push perubahan HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file HTML untuk di-commit."
          else
            git commit -m "Sisipkan banner Google referrer + tombol close ke HTML"
            git push
          fi
